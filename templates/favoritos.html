<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mis Favoritos</title>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: #1a1a2e; 
            color: #eee; 
            padding: 20px; 
            margin: 0;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        h1 { 
            color: #e94560; 
            text-align: center;
            margin-bottom: 30px;
        }
        .back-link {
            display: inline-block;
            margin-bottom: 20px;
            color: #e94560;
            text-decoration: none;
            font-size: 1.1em;
        }
        .back-link:hover {
            text-decoration: underline;
        }
        .favoritos-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
        }
        .favorito-card {
            background: #16213e;
            border-radius: 10px;
            overflow: hidden;
            transition: transform 0.3s ease;
            position: relative;
        }
        .favorito-card:hover {
            transform: scale(1.05);
        }
        .favorito-card img {
            width: 100%;
            height: 280px;
            object-fit: cover;
        }
        .favorito-info {
            padding: 15px;
        }
        .favorito-info h3 {
            margin: 0 0 10px 0;
            color: #e94560;
            font-size: 1em;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .score {
            background: #e94560;
            color: white;
            padding: 3px 10px;
            border-radius: 12px;
            font-size: 0.9em;
            font-weight: bold;
        }
        .remove-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            background: #ff6b6b;
            color: white;
            border: none;
            border-radius: 50%;
            width: 35px;
            height: 35px;
            cursor: pointer;
            font-size: 1.2em;
            transition: background 0.3s;
        }
        .remove-btn:hover {
            background: #ff4757;
        }
        .empty-message {
            text-align: center;
            padding: 50px;
            color: #888;
            font-size: 1.2em;
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="/" class="back-link">← Volver al buscador</a>
        <h1>❤️ Mis Animes Favoritos</h1>
        
        {% if favoritos %}
            <div class="favoritos-grid">
                {% for fav in favoritos %}
                    <div class="favorito-card">
                        <button class="remove-btn" onclick="eliminarFavorito({{ fav.anime_id }})" title="Eliminar">×</button>
                        <img src="{{ fav.imagen }}" alt="{{ fav.titulo }}">
                        <div class="favorito-info">
                            <h3>{{ fav.titulo }}</h3>
                            <span class="score">⭐ {{ fav.score }}</span>
                        </div>
                    </div>
                {% endfor %}
            </div>
        {% else %}
            <div class="empty-message">
                <p>No tienes animes favoritos aún</p>
                <p>¡Busca algunos y agrégalos a favoritos!</p>
            </div>
        {% endif %}
    </div>
    
    <script>
        function eliminarFavorito(animeId) {
            fetch('/api/favorito/' + animeId, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ accion: 'eliminar' })
            })
            .then(function(response) {
                return response.json();
            })
            .then(function(data) {
                if (data.success) {
                    location.reload();
                }
            });
        }
    </script>
</body>
</html>
